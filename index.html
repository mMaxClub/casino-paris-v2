<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino Paris | Gestión Integral</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid #334155;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #38bdf8;
    }
    
    /* Navegación */
    .nav-menu {
      display: flex;
      gap: 0.5rem;
      flex: 1;
    }
    
    .nav-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    
    .nav-btn:hover {
      background: #334155;
      color: white;
    }
    
    .nav-btn.active {
      background: #3b82f6;
      color: white;
      border-color: #2563eb;
    }
    
    /* Status */
    .status-bar {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-size: 0.85rem;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 6px;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    .status-dot.online { background: #22c55e; }
    .status-dot.sync { background: #3b82f6; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    /* Main Container */
    #app {
      padding: 2rem;
      min-height: calc(100vh - 80px);
    }
    
    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      color: #94a3b8;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #334155;
      border-top: 3px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Header con Navegación -->
  <header class="header">
    <div class="logo">
      <span>🎰</span>
      <span>Casino Paris - Gestión</span>
    </div>
    
    <!-- Botones de Navegación -->
    <nav class="nav-menu">
      <button class="nav-btn active" data-view="dashboard">
        <span>📊</span>
        <span>Dashboard</span>
      </button>
      <button class="nav-btn" data-view="plano">
        <span>🗺️</span>
        <span>Plano</span>
      </button>
      <button class="nav-btn" data-view="inventario">
        <span>📋</span>
        <span>Inventario</span>
      </button>
      <button class="nav-btn" data-view="red">
        <span>🌐</span>
        <span>Red</span>
      </button>
      <button class="nav-btn" data-view="mantenimiento">
        <span>🔧</span>
        <span>Mant.</span>
      </button>
      <button class="nav-btn" data-view="banca">
        <span>💰</span>
        <span>Banca</span>
      </button>
      <button class="nav-btn" data-view="premios">
        <span>🏆</span>
        <span>Premios</span>
      </button>
    </nav>
    
    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-item" id="onlineStatus">
        <span class="status-dot online"></span>
        <span id="onlineText">Iniciando...</span>
      </div>
      <div class="status-item" id="syncStatus">
        <span class="status-dot sync"></span>
        <span>Sync OK</span>
      </div>
      <button class="nav-btn" id="btnSincronizar" title="Forzar sincronización">
        <span>⟲</span>
        <span>Sincronizar</span>
      </button>
    </div>
  </header>
  
  <!-- Contenedor Principal -->
  <main id="app">
    <div class="loading">
      <div class="spinner"></div>
      <p>Cargando aplicación...</p>
    </div>
  </main>
  
  <!-- Script principal -->
  <script type="module" src="/src/app.js"></script>
</body>
</html>
